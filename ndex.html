<!DOCTYPE html>
<html lang="vi" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cammeow_AOTR | Bio Links</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    animation: { 'fade-in': 'fadeIn 0.5s ease-out' },
                    keyframes: {
                        fadeIn: {
                            '0%': { opacity: '0', transform: 'translateY(10px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        }
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome cho Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Lớp phủ làm tối/sáng nền để các nút hiển thị rõ ràng trên ảnh chi tiết */
        .bg-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(255, 255, 255, 0.15); /* Light mode */
            z-index: 0;
            transition: all 0.3s ease;
        }
        .dark .bg-overlay {
            background: rgba(0, 0, 0, 0.6); /* Dark mode: tối nền lại để nổi bật thẻ */
        }
        
        /* Hiệu ứng nền kính mờ (Glassmorphism) - Tăng độ đục để dễ đọc chữ */
        /* Hiệu ứng nền kính trong suốt */
        .glass-card {
            background: rgba(255, 255, 255, 0.15); /* Độ trong suốt cao, chỉ có 15% màu trắng */
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
        }
        .dark .glass-card {
            background: rgba(0, 0, 0, 0.2); /* Kính trong suốt hơi ngả đen cho chế độ tối */
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
        }
        .glass-card:hover {
            transform: translateY(-4px) scale(1.02);
            background: rgba(255, 255, 255, 0.3); /* Sáng lên một chút khi di chuột vào */
        }
        .dark .glass-card:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.3);
        }
        /* Viền chữ nhẹ để không bị chìm vào nền */
        .text-shadow { text-shadow: 0 2px 4px rgba(0,0,0,0.3); }
        .dark .text-shadow { text-shadow: 0 2px 5px rgba(0,0,0,0.8); }
    </style>
</head>
<body class="min-h-screen transition-smooth text-slate-800 dark:text-white flex flex-col items-center relative overflow-x-hidden">
    <!-- Video nền -->
    <video autoplay loop muted playsinline class="fixed top-0 left-0 w-full h-full object-cover -z-10">
        <source src="cc.mp4" type="video/mp4">
    </video>     
    <!-- Lớp phủ mờ đè lên ảnh nền -->
    <div class="bg-overlay"></div>

    <!-- Nút chuyển đổi Dark/Light Mode -->
    <button onclick="toggleTheme()" class="absolute top-4 right-4 p-3 rounded-full glass-card transition-smooth z-10 hover:shadow-lg focus:outline-none">
        <i id="theme-icon" class="fa-solid fa-moon text-lg"></i>
    </button>

    <main class="w-full max-w-md mx-auto py-12 px-6 flex flex-col items-center animate-fade-in z-10">
        
        <!-- Avatar -->
        <div class="relative mb-6 group">
            <img src="AVATAR.png" 
                 alt="Cammeow_AOTR" 
                 class="w-32 h-32 rounded-full object-cover border-4 border-white dark:border-white/20 transition-smooth group-hover:border-blue-500 shadow-xl group-hover:shadow-[0_0_20px_rgba(59,130,246,0.6)] object-[center_20%]">
            <div class="absolute inset-0 rounded-full ring-2 ring-transparent group-hover:ring-blue-400 transition-smooth"></div>
        </div>

        <!-- Thông tin cá nhân -->
        <h1 class="text-2xl font-extrabold mb-8 tracking-wide text-shadow">Cammeow_AOTR</h1>

        <!-- Danh sách Liên kết -->
        <div class="w-full space-y-4">

            <!-- Link TikTok -->
            <a href="https://www.tiktok.com/@cammeow_aotr" target="_blank" class="glass-card flex items-center p-4 rounded-2xl transition-smooth cursor-pointer no-underline text-inherit block">
                <i class="fa-brands fa-tiktok text-2xl w-10 text-center text-black dark:text-white"></i>
                <span class="flex-1 text-center font-bold pr-10">TikTok</span>
            </a>

            <!-- Link Zalo -->
            <a href="https://zalo.me/0867244642" target="_blank" class="glass-card flex items-center p-4 rounded-2xl transition-smooth cursor-pointer no-underline text-inherit block">
                <i class="fa-solid fa-comment-dots text-2xl w-10 text-center text-blue-600 dark:text-blue-300"></i>
                <span class="flex-1 text-center font-bold pr-10">Zalo</span>
            </a>

            <!-- Link Discord -->
            <a href="https://discord.gg/eKKUsRZK" target="_blank" class="glass-card flex items-center p-4 rounded-2xl transition-smooth cursor-pointer no-underline text-inherit block">
                <i class="fa-brands fa-discord text-2xl w-10 text-center text-indigo-700 dark:text-indigo-400"></i>
                <span class="flex-1 text-center font-bold pr-10">Discord</span>
            </a>
            
        </div>
    </main>

    <!-- Script xử lý Dark Mode -->
    <script>
        const htmlElement = document.documentElement;
        const themeIcon = document.getElementById('theme-icon');

        function toggleTheme() {
            if (htmlElement.classList.contains('dark')) {
                htmlElement.classList.remove('dark');
                themeIcon.classList.remove('fa-sun');
                themeIcon.classList.add('fa-moon');
            } else {
                htmlElement.classList.add('dark');
                themeIcon.classList.remove('fa-moon');
                themeIcon.classList.add('fa-sun');
            }
        }
    </script>
</body>
</html>
